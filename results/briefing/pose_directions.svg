 <title id="title">25 个候选喷嘴方向</title><desc id="desc">中央一点为竖直朝下。内、中、外三圈分别为倾斜十度、二十度和三十度，每圈八个方位，相邻方位间隔四十五度。所有方向均固定零滚转。</desc>
