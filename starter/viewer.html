<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>机械臂方案比较与轨迹回放</title><link rel="stylesheet" href="viewer.css"></head>
<body><main><header><h1>机械臂方案比较与轨迹回放</h1><nav><a href="https://github.com/Blue-Autumn/ur7e-print-study/tree/main/starter">接入与使用说明</a></nav></header>
<p id="error" role="alert" hidden></p>
<div class="workspace"><section class="scenePanel" aria-label="三维视图与回放">
<div class="toolbar"><button id="fit">适合视图</button><button id="front">正视</button><button id="topview">俯视</button><label><input type="checkbox" id="showPath" checked>轨迹</label><label><input type="checkbox" id="showSkeleton">关节骨架</label><span id="geometryNote"></span></div>
<div class="viewport"><canvas id="mesh" aria-label="机械臂连杆外形"></canvas><canvas id="view" aria-label="拖动旋转、滚轮缩放的三维视图"></canvas><p id="loading" role="status">正在载入方案…</p></div>
<div class="controls"><button id="play" disabled>播放</button><input id="progress" aria-label="轨迹节点" type="range" min="0" value="0" step="1" disabled><output id="frame"></output></div>
<div class="controls jumps"><button id="first" disabled>起点</button><button id="middle" disabled>中点</button><button id="last" disabled>终点</button><span id="stage"></span></div><p id="tcp"></p>
</section>
<aside><section><h2>选择方案</h2><div id="plans" role="group" aria-label="可用方案"></div><p id="planDescription"></p></section>
<section><h2 id="planTitle">当前方案</h2><p id="status" role="status"></p><table aria-label="方案参数与结果"><tbody id="facts"></tbody></table><details><summary>六轴关节角</summary><table aria-label="关节角"><thead><tr><th>关节</th><th>绝对角度 / °</th></tr></thead><tbody id="joints"></tbody></table></details></section>
<section class="imports"><details><summary>接入自己的结果与模型</summary><p>可一次选择多条结果 JSON，新增方案按钮；外形网格使用独立的 visual JSON。</p><label>结果 <input id="file" type="file" multiple accept=".json,application/json"></label><label>外形 <input id="visualFile" type="file" accept=".json,application/json"></label><p id="importStatus" role="status"></p><details><summary>模型与求解身份</summary><p id="identity"></p></details></details></section>
</aside></div></main><script type="module" src="viewer.js"></script></body></html>
